name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv pip install --system -r requirements.txt ruff pyright pytest pytest-asyncio
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: pyright
        run: pyright --level error

  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv pip install --system -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mtlfest_bot:ci .
      - name: Smoke import in container
        run: |
          docker run --rm --entrypoint python mtlfest_bot:ci -c "
          import sys; sys.path.insert(0, '/app')
          import aiogram, aiogram_dialog, motor, cv2, pyzbar.pyzbar, qrcode
          print('container OK, python', sys.version.split()[0])
          "
