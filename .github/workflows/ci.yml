name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: montelibero/mtlfest_bot

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Create venv and install deps
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements.txt ruff pyright pytest pytest-asyncio
      - name: ruff check
        run: .venv/bin/ruff check .
      - name: ruff format check
        run: .venv/bin/ruff format --check .
      - name: pyright
        run: .venv/bin/pyright --level error

  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (zbar for pyzbar)
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - uses: astral-sh/setup-uv@v5
      - name: Create venv and install deps
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mtlfest_bot:ci
      - name: Smoke import in container
        run: |
          docker run --rm --entrypoint python mtlfest_bot:ci -c "
          import sys; sys.path.insert(0, '/app')
          import aiogram, aiogram_dialog, motor, cv2, pyzbar.pyzbar, qrcode
          print('container OK, python', sys.version.split()[0])
          "
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
